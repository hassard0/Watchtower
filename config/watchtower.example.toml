# Watchtower configuration.
# Copy to /etc/watchtower/watchtower.toml on the Pi and edit.

[storage]
db_path = "/var/lib/watchtower/watchtower.db"
retention_days = 7

[bus]
queue_size = 10000

[logging]
level = "INFO"
format = "json"

[api]
host = "0.0.0.0"
port = 80

[scanners.ble]
enabled = true
# "hci0" is the Pi's built-in Cypress radio (BT 5.0). If you've plugged
# in a USB BT adapter for better range/sensitivity (e.g. Realtek BT 6.0
# at 0bda:a760), set this to "hci1" — and enable bt-hci1-up.service
# (deploy/bt-hci1-up.service) so the adapter comes up at boot. hci0
# stays available for the Find-My broadcaster + honeypot, which both
# ride bluetoothctl's default controller.
adapter = "hci0"

[scanners.wifi]
enabled = true
interface = "wlan0"        # Pi's built-in WiFi (active scan, non-destructive)
scan_interval_sec = 30.0

[scanners.subghz]
enabled = true
device_index = 0          # which RTL-SDR (0 or 1)
center_freq_hz = 433920000
sample_rate_hz = 2048000
rtl_433_args = ["-F", "json", "-d", "0", "-M", "level", "-M", "protocol", "-M", "stats:1:60"]

[scanners.midband]
enabled = true
device_index = 1          # the other RTL-SDR
# Wide-band sweep across 24 MHz - 1.7 GHz. ~22-second full cycle at 1s dwell.
# Covers FM, aviation, walkie-talkie, ISM, cellular, ADS-B, GPS.
sweep_freqs_hz = [
    25_000_000,
    98_000_000,    # FM broadcast
    122_000_000,   # aviation VHF
    146_000_000,   # 2m amateur
    155_000_000,   # business/marine VHF
    162_550_000,   # NOAA weather radio
    195_000_000,   # VHF-TV
    315_000_000,   # mil/aero (US key fobs)
    433_920_000,   # ISM (EU key fobs / weather sensors)
    462_500_000,   # FRS / GMRS walkie-talkies
    488_000_000,   # UHF-TV
    617_000_000,   # 5G band 71
    734_000_000,   # LTE 700
    881_000_000,   # LTE 850
    915_000_000,   # ISM (LoRa, Z-Wave US)
    944_000_000,   # GSM 900
    1_090_000_000, # ADS-B aircraft
    1_227_000_000, # GPS L2
    1_350_000_000, # cellular L-band
    1_575_420_000, # GPS L1
    1_602_000_000, # GLONASS
    1_675_000_000, # weather satellite downlinks
]
dwell_seconds = 1.0
sample_rate_hz = 2048000
