# Watchtower private HTTPS endpoint. Installed as nginx's default LAN site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Bootstrap the private trust root without first accepting an untrusted
    # HTTPS connection. This contains only the public CA certificate.
    location = /watchtower-ca.crt {
        alias /etc/watchtower/tls/watchtower-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="watchtower-ca.crt"';
        add_header Cache-Control 'no-store';
    }

    location / {
        return 308 https://$host$request_uri;
    }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/watchtower/tls/watchtower.crt;
    ssl_certificate_key /etc/watchtower/tls/watchtower.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WATCHTOWER:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /watchtower-ca.crt {
        alias /etc/watchtower/tls/watchtower-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="watchtower-ca.crt"';
        add_header Cache-Control 'no-store';
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        client_max_body_size 2m;
    }
}
