[project]
name = "watchtower"
version = "0.1.0"
description = "Perimeter RF awareness layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "pyrtlsdr>=0.3.0,<0.4",   # pyrtlsdr 0.4 requires rtlsdr_set_dithering, missing from Debian 13 librtlsdr 2.0.2
    "setuptools>=68,<80",     # pyrtlsdr 0.3.x imports pkg_resources; setuptools dropped it in v80+
    "python-ulid>=2.7",
    "structlog>=24.4",
    "tomli>=2.0; python_version<'3.11'",
    "click>=8.1",
    "numpy>=1.26",
    "typing-extensions>=4.0",
    "aiohttp>=3.9",
]

[project.scripts]
watchtower = "watchtower.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "integration: tests that require the live Pi over SSH",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower"]

[tool.hatch.build.targets.wheel.force-include]
"src/watchtower/storage/schema.sql" = "watchtower/storage/schema.sql"
"src/watchtower/static/index.html" = "watchtower/static/index.html"
"src/watchtower/static/assets/app.js" = "watchtower/static/assets/app.js"
