[project]
name = "watchtower"
version = "0.1.0"
description = "Perimeter RF awareness layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "pyrtlsdr>=0.3.0",
    "python-ulid>=2.7",
    "structlog>=24.4",
    "tomli>=2.0; python_version<'3.11'",
    "click>=8.1",
]

[project.scripts]
watchtower = "watchtower.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "integration: tests that require the live Pi over SSH",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower"]

[tool.hatch.build.targets.wheel.force-include]
"src/watchtower/storage/schema.sql" = "watchtower/storage/schema.sql"
